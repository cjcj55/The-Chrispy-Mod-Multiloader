# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Environment Properties
java_version=25
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_loader_version=0.19.5
fabric_api_version=0.160.7+26.3

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge for new versions
forge_version=26.2-65.0.0
forge_version_range=[65,)

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.3-beta

# JEI, only loaded in the dev runs (see the loader build.gradle files); pick the version listed for the Minecraft version at
# https://maven.blamejared.com/mezz/jei/
jei_version=31.0.0.7

# Mod Properties
mod_id=chrispymod
mod_group=com.cjcj55.chrispymod
mod_version=0.0.1+26.3
mod_name=The Chrispy Mod
mod_description=The description of your mod. \nAccepts multilines.
mod_author=cjcj55
mod_credits=
mod_license=MIT
mod_icon=assets/examplemod/icon.png
mod_homepage=https://example.com/
mod_github=https://github.com/moritz-htk/MultiLoader-Template