plugins {
    id 'multiloader-loader'
}

loom {
    // Automatically convert AccessWideners to AccessTransformers if the file exists
    def awFile = project(':common').file("src/main/resources/${project.mod_id}.classtweaker")
    if (awFile.exists()) {
        convertAw2At(tasks.named('jar', Jar), ["${project.mod_id}.classtweaker"])
    }

    runs {
        clientData {
            client()
            environment('clientData')
            programArgs '--all', '--mod', "${project.mod_id}"
            programArgs '--output', project(':common').file('src/main/generated').absolutePath
            programArgs '--existing', project(':common').file('src/main/resources').absolutePath
        }
    }
}

repositories {
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = 'Blamejared'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    forgeUserdev "net.neoforged:neoforge:${project.neoforge_version}:userdev"

    // Development only: JEI is loaded by runClient, but is not a dependency of the built mod.
    localRuntime "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"
    // The JEI API is needed to compile the optional compat plugin; compileOnly keeps it out of the built jar.
    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
}